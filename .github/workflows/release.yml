name: OpenLore Release & Packaging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Release Tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install ".[dev,usd]"

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/

      - name: Package Distributions & DCC Sidecars
        run: |
          python scripts/package_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

  desktop-release:
    name: Build & Publish Desktop (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact_patterns: |
              web/dist-electron/*.exe
          - platform: Linux
            os: ubuntu-latest
            artifact_patterns: |
              web/dist-electron/*.AppImage
              web/dist-electron/*.deb
          - platform: macOS
            os: macos-latest
            artifact_patterns: |
              web/dist-electron/*.dmg

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build Electron App (${{ matrix.platform }})
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd web
          npm run electron:dist 2>&1 | tee /tmp/electron-build.log

      - name: Report Build Failure
        if: failure()
        run: |
          echo "### ❌ Build Failed on ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 /tmp/electron-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Desktop Packages to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_patterns }}

