name: OpenLore Release & Packaging

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build & Release Tooling
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install ".[dev,usd]"

      - name: Run Test Suite
        env:
          PYTHONPATH: src
        run: |
          pytest tests/

      - name: Package Distributions & DCC Sidecars
        run: |
          python scripts/package_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openlore-*.whl
            dist/openlore-*.tar.gz
            dist/openlore-blender-*.zip
            dist/openlore-maya-*.zip
            dist/openlore-houdini-*.zip
            dist/openlore-unreal-*.zip
            dist/openlore-unity-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
