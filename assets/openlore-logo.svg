<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Gradients for isometric USD glass cube -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glassLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="glassRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Edge highlight gradients -->
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Neon branch glows -->
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .logo-title {
        font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", "Inter", Roboto, sans-serif;
        font-weight: 800;
        font-size: 76px;
        letter-spacing: 0.14em;
        fill: #ffffff;
      }
      .logo-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", "Inter", Roboto, sans-serif;
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.22em;
        fill: #94a3b8;
      }
      @media (prefers-color-scheme: light) {
        .logo-title {
          fill: #0f172a;
        }
        .logo-subtitle {
          fill: #475569;
        }
        .outer-wire {
          stroke: #0284c7;
        }
      }
    </style>
  </defs>

  <!-- Group: Isometric USD Layer Stage & Branches -->
  <g transform="translate(40, 20)">
    <!-- Ambient back glow -->
    <circle cx="120" cy="120" r="100" fill="#00e5ff" opacity="0.06" filter="url(#glowCyan)"/>
    <circle cx="160" cy="120" r="100" fill="#ff9900" opacity="0.06" filter="url(#glowAmber)"/>

    <!-- Outer Isometric Cube Faces -->
    <!-- Top Face: (140, 40) -> (210, 80) -> (140, 120) -> (70, 80) -->
    <polygon points="140,40 210,80 140,120 70,80" fill="url(#glassTop)" stroke="url(#edgeHighlight)" stroke-width="2"/>
    <!-- Left Face: (70, 80) -> (140, 120) -> (140, 200) -> (70, 160) -->
    <polygon points="70,80 140,120 140,200 70,160" fill="url(#glassLeft)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Right Face: (140, 120) -> (210, 80) -> (210, 160) -> (140, 200) -->
    <polygon points="140,120 210,80 210,160 140,200" fill="url(#glassRight)" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- Inner USD Stage Chamber (Nested Cube) -->
    <polygon points="140,65 185,90 140,115 95,90" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
    <polygon points="95,90 140,115 140,165 95,140" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1"/>
    <polygon points="140,115 185,90 185,140 140,165" fill="#d97706" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1"/>

    <!-- Cyan Git Branch Trace (USD Composition Layers / Scene Stage) -->
    <g filter="url(#glowCyan)">
      <path d="M 20,135 L 75,135 Q 95,135 110,120 L 140,120" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 75,135 Q 90,135 100,150 L 125,185" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="135" r="5" fill="#00e5ff"/>
      <circle cx="140" cy="120" r="4" fill="#ffffff"/>
      <circle cx="125" cy="185" r="3.5" fill="#00e5ff"/>
      <!-- Top vertical trace -->
      <path d="M 105,45 L 105,90" fill="none" stroke="#00e5ff" stroke-width="2" stroke-dasharray="3,3" stroke-linecap="round"/>
      <circle cx="105" cy="45" r="3.5" fill="#00e5ff"/>
    </g>

    <!-- Amber Git Branch Trace (Narrative Lore & Vector Clocks) -->
    <g filter="url(#glowAmber)">
      <path d="M 140,120 L 170,120 Q 185,120 205,105 L 260,105" fill="none" stroke="#ff9100" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 185,120 Q 200,120 205,135 L 215,165" fill="none" stroke="#ff9100" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="260" cy="105" r="5" fill="#ff9100"/>
      <circle cx="215" cy="165" r="3.5" fill="#ff9100"/>
      <!-- Top right trace -->
      <path d="M 175,90 L 175,55 Q 175,45 195,40 L 215,40" fill="none" stroke="#ff9100" stroke-width="2" stroke-linecap="round"/>
      <circle cx="215" cy="40" r="3.5" fill="#ff9100"/>
    </g>

    <!-- Outer cube wire accent -->
    <polygon points="140,40 210,80 210,160 140,200 70,160 70,80" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- Typography: Wordmark & Subtitle -->
  <text x="350" y="130" class="logo-title">OPENLORE</text>
  <text x="352" y="172" class="logo-subtitle">VERSION CONTROL &amp; LORE ENGINE FOR 3D WORLDS</text>
</svg>
