services:
  # 1. OpenLore Web Studio & REST/WebSocket Server
  openlore-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openlore-api
    restart: always
    ports:
      - "8000:8000"
      - "11111:11111/udp"
      - "11112:11112/udp"
    environment:
      - OPENLORE_AUTH_ENABLED=true
      - OPENLORE_CAS_ROOT=/app/data/cas
      - OPENLORE_KAFKA_SERVERS=kafka:29092
      - OPENLORE_OPA_URL=http://opa:8181/v1/data/openlore/royalties
      - OPENLORE_TRIPLESTORE_URL=http://triplestore:3030/openlore
      - OPENLORE_TEMPORAL_URL=temporal:7233
    volumes:
      - openlore_cas:/app/data/cas
      - openlore_stages:/app/stages
      - openlore_builds:/app/builds
    depends_on:
      - kafka
      - opa
      - triplestore
      - temporal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Apache Kafka / Redpanda Streaming Engine
  kafka:
    image: redpandadata/redpanda:v23.3.11
    container_name: openlore-kafka
    restart: always
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://localhost:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # 3. MinIO S3-Compatible Content Addressed Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: openlore-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=openloreadmin
      - MINIO_ROOT_PASSWORD=openloresecurepassword2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3

  # 4. Open Policy Agent (OPA)
  opa:
    image: openpolicyagent/opa:0.65.0
    container_name: openlore-opa
    restart: always
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./schemas/opa:/policies

  # 5. W3C RDF Triplestore (Apache Jena Fuseki)
  triplestore:
    image: secoresearch/fuseki:5.0.0
    container_name: openlore-triplestore
    restart: always
    ports:
      - "3030:3030"
    environment:
      - ADMIN_PASSWORD=admin
    volumes:
      - ./schemas/ontology:/fuseki/databases

  # 6. Temporal Workflow Orchestration Server
  temporal:
    image: temporalio/auto-setup:1.24.1
    container_name: openlore-temporal
    restart: always
    ports:
      - "7233:7233"
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml

  # 7. Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.26.1
    container_name: openlore-temporal-ui
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

volumes:
  openlore_cas:
  openlore_stages:
  openlore_builds:
  redpanda_data:
  minio_data:
