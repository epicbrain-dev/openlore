apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: openlore
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openlore
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openlore
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: openlore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-ws
              containerPort: 8000
              protocol: TCP
            - name: livelink-tx
              containerPort: 11111
              protocol: UDP
            - name: livelink-rx
              containerPort: 11112
              protocol: UDP
          env:
            - name: OPENLORE_AUTH_ENABLED
              value: "{{ .Values.env.authEnabled }}"
            - name: OPENLORE_KAFKA_SERVERS
              value: "{{ .Values.env.kafkaServers }}"
            - name: OPENLORE_OPA_URL
              value: "{{ .Values.env.opaUrl }}"
            - name: OPENLORE_TRIPLESTORE_URL
              value: "{{ .Values.env.triplestoreUrl }}"
            - name: OPENLORE_TEMPORAL_URL
              value: "{{ .Values.env.temporalUrl }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
