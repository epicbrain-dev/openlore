apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: openlore
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  OPENLORE_AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
  OPENLORE_SIGNING_KEY: {{ .Values.secrets.signingKey | quote }}
