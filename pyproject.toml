[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openlore"
version = "1.0.1"
description = "Git for 3D worlds, game lore, and Hollywood pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "OpenLore Engineering Team", email = "engineering@openlore.io" }
]
keywords = [
    "openusd",
    "materialx",
    "game-dev",
    "vfx-pipeline",
    "crdt",
    "knowledge-graph",
    "rdf",
    "digital-asset-management",
    "pipeline-td",
    "virtual-production"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]

dependencies = [
    "blake3>=0.4.1",
    "pydantic>=2.8.0",
    "click>=8.1.7",
    "rich>=13.7.1",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
    "confluent-kafka>=2.4.0",
    "temporalio>=1.6.0",
    "requests>=2.32.3",
    "pyyaml>=6.0.1",
    "typing-extensions>=4.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.7",
    "mypy>=1.10.0",
    "usd-core>=23.11",
    "materialx>=1.38.10"
]
usd = [
    "usd-core>=23.11",
    "materialx>=1.38.10"
]

[project.scripts]
openlore = "openlore.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openlore"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:rdflib.*:",
    "ignore::urllib3.exceptions.NotOpenSSLWarning:",
]
